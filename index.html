<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Binary Portrait</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero" aria-labelledby="hero-name">
      <canvas class="portrait" role="img" aria-label="Portrait rendered with binary digits"></canvas>
      <p class="specialty" data-scramble>Full-Stack Web Developer</p>
      <p class="statement" aria-label="I build full-stack web applications that are fast, reliable, and scalable.">
        <span data-scramble>I BUILD FULL-STACK WEB</span>
        <span data-scramble>APPLICATIONS THAT ARE FAST,</span>
        <span data-scramble>RELIABLE, AND SCALABLE.</span>
      </p>
      <div class="identity">
        <h1 id="hero-name" data-scramble>RAFSAN</h1>
      </div>
      <div class="social-icons" role="group" aria-label="Social media icons">
        <button class="social-button" type="button" aria-label="YouTube">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
        </button>
        <button class="social-button" type="button" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="social-dot" cx="17.5" cy="6.8" r="1"/></svg>
        </button>
        <button class="social-button" type="button" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 2H3.55C2.7 2 2 2.67 2 3.5v17c0 .83.7 1.5 1.55 1.5h16.9c.85 0 1.55-.67 1.55-1.5v-17c0-.83-.7-1.5-1.55-1.5ZM8 19H5V9h3v10ZM6.5 7.7a1.75 1.75 0 1 1 0-3.5 1.75 1.75 0 0 1 0 3.5ZM19 19h-3v-4.9c0-1.17-.02-2.68-1.63-2.68-1.63 0-1.88 1.27-1.88 2.6V19h-3V9h2.88v1.37h.04c.4-.76 1.38-1.56 2.84-1.56C18.28 8.81 19 10.8 19 13.4V19Z"/></svg>
        </button>
      </div>
      <div class="grid-markers" aria-hidden="true">
        <span style="left: 0%; top: 0%"></span><span style="left: 33.333%; top: 0%"></span><span style="left: 66.666%; top: 0%"></span><span style="left: 100%; top: 0%"></span>
        <span style="left: 0%; top: 33.333%"></span><span style="left: 33.333%; top: 33.333%"></span><span style="left: 66.666%; top: 33.333%"></span><span style="left: 100%; top: 33.333%"></span>
        <span style="left: 0%; top: 66.666%"></span><span style="left: 33.333%; top: 66.666%"></span><span style="left: 66.666%; top: 66.666%"></span><span style="left: 100%; top: 66.666%"></span>
        <span style="left: 0%; top: 100%"></span><span style="left: 33.333%; top: 100%"></span><span style="left: 66.666%; top: 100%"></span><span style="left: 100%; top: 100%"></span>
      </div>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
